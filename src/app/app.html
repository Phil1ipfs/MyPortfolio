<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to content</a>

<!-- Ambient background: static glow always, WebGL liquid layered on top when motion is allowed -->
<div class="backdrop" aria-hidden="true">
  <div class="backdrop__glow"></div>
  <div #liquidEther class="backdrop__liquid"></div>
  <div class="backdrop__grain"></div>
</div>

<app-navbar />

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <span class="site-footer__logo" aria-hidden="true">{{ profile.initials }}</span>
      <div>
        <p class="site-footer__name">{{ profile.firstName }} {{ profile.lastName }}</p>
        <p class="site-footer__role">{{ profile.role }}</p>
      </div>
    </div>

    <ul class="site-footer__social" role="list">
      <li>
        <a [href]="'mailto:' + profile.email" aria-label="Email"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
      </li>
      <li>
        <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
      </li>
      <li>
        <a [href]="profile.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
      </li>
    </ul>

    <p class="site-footer__copy">
      &copy; {{ year }} {{ profile.firstName }} {{ profile.lastName }}
      <span aria-hidden="true">·</span>
      <a routerLink="/" fragment="home">Back to top</a>
    </p>
  </div>
</footer>

<app-cert-viewer />

<!-- Portfolio Assistant: launcher is eager, the panel + engine load lazily -->
<app-chatbot />
